[www]
; Pass the container environment (APP_KEY, ADMIN_PASSWORD_HASH, MAIL_*...) to
; PHP workers: Laravel reads it directly, no .env file inside the image.
clear_env = no

pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
request_terminate_timeout = 60

ping.path = /ping
ping.response = pong

; Laravel logs to stderr (LOG_CHANNEL=stderr): forward it to `docker logs`.
catch_workers_output = yes
decorate_workers_output = no
