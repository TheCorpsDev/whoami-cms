# Development: only the API and uploaded files. Vite (port 5173) serves the
# React app and proxies /api and /storage here.
server {
    listen 80;
    server_name _;
    client_max_body_size 55M;

    location = /healthz { try_files /nonexistent @php; }
    location ^~ /api/ { try_files /nonexistent @php; }

    location @php {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        try_files $uri =404;
    }
}
