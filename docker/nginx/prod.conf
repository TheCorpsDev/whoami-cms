server {
    listen 80;
    server_name _;
    charset utf-8;
    server_tokens off;
    client_max_body_size 55M;

    include /etc/nginx/snippets/security-headers.conf;

    # Docker replaces the app container on deploy: resolve it at request time.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Liveness of this container only, used by its healthcheck.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Readiness through Laravel's health route (the app boots and responds).
    location = /healthz { try_files /nonexistent @php; }

    # Small public forms: a tiny body limit, so anonymous clients cannot keep PHP busy with 55 MB uploads.
    location = /api/contact { client_max_body_size 32k; try_files /nonexistent @php; }
    location = /api/admin/login { client_max_body_size 32k; try_files /nonexistent @php; }

    location ^~ /api/ { try_files /nonexistent @php; }

    location @php {
        set $php_fpm app:9000;
        fastcgi_pass $php_fpm;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_read_timeout 120;
    }

    # Uploaded photo and CV, read-only from the shared storage volume.
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ^~ /assets/ {
        root /var/www/frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        try_files $uri =404;
    }

    # Browsers must always check for a new service worker and manifest.
    location = /sw.js {
        root /var/www/frontend;
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        include /etc/nginx/snippets/security-headers.conf;
    }
    location = /manifest.webmanifest {
        root /var/www/frontend;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The admin is reachable only by typing /admin; keep it out of search engines.
    location ^~ /admin {
        root /var/www/frontend;
        try_files /index.html =404;
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        root /var/www/frontend;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ~ /\.(?!well-known) { deny all; }
}
