# Local development: http://localhost:5174 (site and /admin), API via Nginx on :8081,
# e-mails caught by Mailpit on http://localhost:8026 (ports: FRONTEND_PORT, API_PORT, MAILPIT_PORT).
name: whoami-cms-dev

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${API_PORT:-8081}:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    restart: unless-stopped

  frontend:
    image: node:24-alpine
    working_dir: /app
    environment:
      VITE_API_PROXY: http://nginx:80
    volumes:
      - ./frontend:/app
      # Linux-musl modules stay in the container and never clash with the host's.
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5174}:5173"
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    depends_on: [nginx]
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_PORT:-8026}:8025"
    restart: unless-stopped

volumes:
  frontend_node_modules:
